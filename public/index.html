 const pk=P.prot==null?o[1]:+P.prot,fp=P.fat==null?o[2]:+P.fat,p=pk*w,g=vet*fp/100/9,c=(vet-p*4-g*9)/4,im=w/Math.pow(h/100,2);
 return{a,w,h,sx,tmb,eqf:`${t[1]} × ${w} + ${t[2]}`,naf,get,adj,vet,pk,fp,p,g,c,fi:vet/1000*14,im,cls:IMC.find(x=>im<x[0])[1],just:o[3],obj:P.obj,vetc:+P.vetc||null}}

function rAval(){const p=S.prof,o=OBJ[p.obj];

${p.sexo==='O'?`<div><label>Equação da TMB a usar</label><select id="f_eq" onchange="P()"><option value="F" ${p.eq==='F'?'selected':''}>Coeficientes femininos</option><option value="M" ${p.eq==='M'?'selected':''}>Coeficientes masculinos</option></select></div>`:''}
<div><label>Data de nascimento</label><input type="date" id="f_nasc" value="${p.nasc}" oninput="P()"></div>
<div><label>Peso (kg)</label><input type="number" step="0.1" id="f_peso" value="${p.peso}" oninput="P()"></div>

<div><label>VET de consumo atual (kcal, opcional)</label><input type="number" id="f_vetc" value="${p.vetc}" oninput="P()"></div>
<div><label>Objetivo</label><select onchange="setObj(this.value)">${Object.keys(OBJ).map(k=>`<option ${p.obj===k?'selected':''}>${k}</option>`).join('')}</select></div>

<tr><td>NAF</td><td class="r">${n(r.naf,3)}</td></tr><tr><td>GET = TMB × NAF</td><td class="r"><b>${n(r.get,0)} kcal</b></td></tr>
${r.vetc?`<tr><td>VET de consumo atual</td><td class="r">${n(r.vetc,0)} kcal (${n((r.vetc/r.get-1)*100,0)}% do GET)</td></tr>`:''}

$('app').innerHTML=`<div class="c"><div class="row"><div><label>Data</label><input type="date" id="dd" value="${date}" onchange="date=this.value;rDiario()"></div>
<div><label>Visualização</label><select onchange="view=this.value;rDiario()"><option value="ref" ${view==='ref'?'selected':''}>Por refeição</option><option value="dia" ${view==='dia'?'selected':''}>Total do dia</option></select></div></div></div>
<div class="c"><h2>Adicionar alimento</h2><div class="g"><div><label>Refeição</label><select id="am">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select></div>
<div style="grid-column:span 2"><label>Alimento (digite para buscar)</label><input id="af" list="fl" oninput="meas()" autocomplete="off"><datalist id="fl">${foods().map(f=>`<option value="${esc(lab(f))}">`).join('')}</datalist></div>
<div><label>Quantidade</label><input type="number" step="0.5" id="aq" value="1"></div><div><label>Medida</label><select id="ame"><option value="g">g / ml</option></select></div>
<div id="abw" style="display:none"><label><input type="checkbox" id="ab" style="width:auto"> peso bruto (com casca/osso)</label></div></div>
<button class="b" style="margin-top:10px" onclick="addE()">Adicionar</button></div><div id="dv"></div>`;dv()}
function meas(){const f=foods().find(x=>lab(x)===$('af').value);$('ame').innerHTML=(f?f.m.map((m,i)=>`<option value="${i}">${esc(m.n)} (${m.g} g)</option>`).join(''):'')+'<option value="g">g / ml</option>';$('abw').style.display=f&&f.fc>1?'block':'none'}
function addE(){const f=foods().find(x=>lab(x)===$('af').value),q=+$('aq').value;if(!f||!q)return alert('Escolha um alimento da lista e a quantidade.');
 const me=$('ame').value;let g,l;if(me==='g'){g=q;l=n(q,0)+' g'}else{const m=f.m[+me];g=q*m.g;l=n(q,q%1?1:0)+' × '+m.n}
 if($('ab').checked&&f.fc>1){g=g/f.fc;l+=' (bruto)'}
 S.diary.push({id:Date.now(),d:date,m:$('am').value,f:f.id,g,l});sv();rDiario()}
function delE(id){S.diary=S.diary.filter(e=>e.id!==id);sv();dv()}
function dv(){const E=S.diary.filter(e=>e.d===date).map(e=>{const f=food(e.f);return{...e,fn:f?f.n:'(removido)',v:f?nut(f,e.g):sum([])}});const e=$('dv');if(!e)return;
 if(view==='ref'){e.innerHTML=MEALS.map(m=>{const L=E.filter(x=>x.m===m);if(!L.length)return'';const t=sum(L.map(x=>x.v));
 return`<div class="c"><h2>${m} — ${n(t.k,0)} kcal</h2><div class="mu">P ${n(t.p)} g · C ${n(t.c)} g · G ${n(t.g)} g · Fibras ${n(t.fi)} g</div>${L.map(x=>`<details><summary>${esc(x.l)} ${esc(x.fn)} — ${n(x.v.k,0)} kcal</summary><div class="mu">${n(x.g,0)} g · P ${n(x.v.p)} · C ${n(x.v.c)} · G ${n(x.v.g)} · Fib ${n(x.v.fi)} <button class="s" onclick="delE(${x.id})">remover</button></div></details>`).join('')}</div>`}).join('')||'<div class="c mu">Nada registrado neste dia.</div>';
 const t=sum(E.map(x=>x.v));e.innerHTML+=`<div class="c"><b>Total do dia: ${n(t.k,0)} kcal</b> <span class="mu">· P ${n(t.p,0)} g · C ${n(t.c,0)} g · G ${n(t.g,0)} g</span></div>`}
 else{const t=sum(E.map(x=>x.v)),G=goals();const NM=[['k','Energia (kcal)',0],['p','Proteína (g)',1],['c','Carboidrato (g)',1],['fi','Fibra (g)',1],['g','Gordura (g)',1],['na','Sódio (mg)',0],['ca','Cálcio (mg)',0],['kk','Potássio (mg)',0],['vc','Vitamina C (mg)',1],['co','Colesterol (mg)',0]];
 e.innerHTML=`<div class="c"><h2>Total do dia</h2><table><tr><th>Nutriente</th><th class="r">Consumido</th><th class="r">Meta</th></tr>${NM.map(x=>{const mt=G[x[0]];return`<tr><td>${x[1]}</td><td class="r">${n(t[x[0]],x[2])}</td><td class="r">${mt?n(mt,0):'—'}</td></tr>${mt?`<tr><td colspan="3" style="padding:0 0 6px"><div class="bar"><i style="width:${Math.min(100,t[x[0]]/mt*100)}%"></i></div></td></tr>`:''}`}).join('')}</table><div class="mu">Sódio, cálcio, potássio, vit. C e colesterol só somam alimentos que têm esses dados.</div></div>`}}
/* ---------- banco de alimentos ---------- */
function rAlim(){$('app').innerHTML=`<div class="c"><h2>Banco de alimentos</h2><input placeholder="Buscar…" value="${esc(fq)}" oninput="fq=this.value;fl()"><div id="fl2"></div></div>
<div class="c"><h2>Cadastrar alimento personalizado (por 100 g)</h2><div class="g">
<div><label>Nome</label><input id="cn"></div><div><label>Estado</label><select id="cs">${['cru','cozido','assado','frito','grelhado','preparado','pronto'].map(x=>`<option>${x}</option>`).join('')}</select></div>
${[['ck','kcal'],['cp','Proteína g'],['cc','Carboidrato g'],['cf','Fibra g'],['cg','Gordura g'],['cna','Sódio mg'],['cca','Cálcio mg'],['ckk','Potássio mg'],['cvc','Vit. C mg'],['cco','Colesterol mg'],['cfc','Fator de correção (bruto/comestível)']].map(x=>`<div><label>${x[1]}</label><input type="number" step="any" id="${x[0]}"></div>`).join('')}</div>
<label style="margin-top:8px">Medidas caseiras (nome=gramas; separe com ;) — ex.: 1 unidade=100; colher de sopa=15</label><input id="cm"><button class="b" style="margin-top:10px" onclick="addF()">Salvar alimento</button>
<div class="mu">Exemplo: Leite A — 67,82 kcal, 6,18 g prot., 0,5 g gord., 9,65 g carb. com medida “unidade=100” (já cadastrado abaixo).</div></div>`;fl()}
function fl(){const q=fq.toLowerCase();$('fl2').innerHTML=foods().filter(f=>lab(f).toLowerCase().includes(q)).map(f=>`<details><summary>${esc(lab(f))} — ${n(f.k,0)} kcal</summary><div class="mu">${n(f.p)} g P · ${n(f.c)} g C · ${n(f.fi)} g Fib · ${n(f.g)} g G${f.na!=null?` · Na ${f.na} mg · Ca ${f.ca} · K ${f.kk} · VitC ${f.vc} · Col ${f.co}`:''}<br>Medidas: ${f.m.map(m=>esc(m.n)+' = '+m.g+' g').join('; ')||'—'}<br>Estado: ${esc(f.st)} · Fator de correção: ${f.fc||1}<br>Fonte: ${esc(f.src)} · incluído em ${f.dt}${f.oficial?'':` <button class="s" onclick="delF('${f.id}')">excluir</button>`}</div></details>`).join('')}
function addF(){const v=id=>$(id).value===''?null:+$(id).value,nm=$('cn').value.trim();if(!nm||v('ck')==null)return alert('Informe nome e kcal.');
 const m=$('cm').value.split(';').map(s=>s.split('=')).filter(a=>a.length===2&&+a[1]).map(a=>({n:a[0].trim(),g:+a[1]}));
 S.custom.push({id:'u'+Date.now(),n:nm,st:$('cs').value,k:v('ck'),p:v('cp')||0,c:v('cc')||0,fi:v('cf')||0,g:v('cg')||0,na:v('cna'),ca:v('cca'),kk:v('ckk'),vc:v('cvc'),co:v('cco'),fc:v('cfc')||1,m,src:'Personalizado (cadastro manual)',dt:today()});sv();rAlim()}
function delF(id){S.custom=S.custom.filter(f=>f.id!==id);sv();rAlim()}
if(!S.custom.length&&!S.seeded){S.custom.push({id:'u0',n:'Leite A',st:'pronto',k:67.82,p:6.18,c:9.65,fi:0,g:0.5,na:null,ca:null,kk:null,vc:null,co:null,fc:1,m:[{n:'1 unidade',g:100}],src:'Personalizado (exemplo do usuário)',dt:today()});S.seeded=1;sv()}
/* ---------- evolução ---------- */
function rEvol(){const B=[...S.body].sort((a,b)=>a.d.localeCompare(b.d)),W=B.filter(b=>b.peso),h=+S.prof.alt;
 let ch='';if(W.length>1){const ps=W.map(b=>b.peso),mn=Math.min(...ps)-1,mx=Math.max(...ps)+1,pt=W.map((b,i)=>`${20+i*(260/(W.length-1))},${100-(b.peso-mn)/(mx-mn)*85}`).join(' ');ch=`<svg viewBox="0 0 300 120" style="width:100%"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pt}"/>${pt.split(' ').map((p,i)=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="var(--ac)"/>`).join('')}<text x="2" y="14" font-size="9" fill="var(--mu)">${n(mx)}</text><text x="2" y="104" font-size="9" fill="var(--mu)">${n(mn)}</text></svg><div class="mu">${W.map(b=>n(b.peso)).join(' → ')} kg</div>`}
 $('app').innerHTML=`<div class="c"><h2>Registrar medidas</h2><div class="g"><div><label>Data</label><input type="date" id="bd" value="${today()}"></div>${[['bp','Peso kg'],['bc','Cintura cm'],['bq','Quadril cm'],['bb','Braço cm'],['bx','Coxa cm'],['bg','% gordura']].map(x=>`<div><label>${x[1]}</label><input type="number" step="0.1" id="${x[0]}"></div>`).join('')}</div><button class="b" style="margin-top:10px" onclick="addB()">Salvar</button><div class="mu">Veja a aba Medidas para aprender a medir.</div></div>
<div class="c"><h2>Peso</h2>${ch||'<div class="mu">Registre ao menos 2 pesos para ver o gráfico.</div>'}</div>
<div class="c tw"><table><tr><th>Data</th><th>Peso</th><th>IMC</th><th>Cint.</th><th>Quad.</th><th>Braço</th><th>Coxa</th><th>%G</th><th></th></tr>${B.slice().reverse().map(b=>`<tr><td>${b.d}</td><td>${b.peso||'—'}</td><td>${b.peso&&h?n(b.peso/Math.pow(h/100,2)):'—'}</td><td>${b.cin||'—'}</td><td>${b.qua||'—'}</td><td>${b.bra||'—'}</td><td>${b.cox||'—'}</td><td>${b.gor||'—'}</td><td><button class="s" onclick="S.body=S.body.filter(x=>x.id!==${b.id});sv();rEvol()">x</button></td></tr>`).join('')}</table></div>`}
function addB(){const v=id=>+$(id).value||null;S.body.push({id:Date.now(),d:$('bd').value,peso:v('bp'),cin:v('bc'),qua:v('bq'),bra:v('bb'),cox:v('bx'),gor:v('bg')});sv();rEvol()}
/* ---------- manequim ---------- */
let msx='F';
function rMed(){const F=msx==='F',tx=F?'':'';
 const ys=[[82,'Pescoço'],[130,F?'Busto/Tórax':'Tórax'],[175,'Cintura'],[200,'Abdome'],[235,'Quadril'],[140,'Braço'],[290,'Coxa'],[350,'Panturrilha']];
 const body=F?`<polygon points="72,92 128,92 124,135 112,178 88,178 76,135" /><polygon points="86,178 114,178 134,235 66,235"/>`:`<polygon points="58,92 142,92 130,140 118,178 82,178 70,140"/><polygon points="82,178 118,178 126,235 74,235"/>`;
 const lx=F?[50,150]:[44,156];
 $('app').innerHTML=`<div class="c"><div class="row"><div><label>Manequim</label><select onchange="msx=this.value;rMed()"><option value="F" ${F?'selected':''}>Feminino</option><option value="M" ${F?'':'selected'}>Masculino</option></select></div></div>
<svg viewBox="0 0 200 420" style="width:100%;max-width:300px;display:block;margin:10px auto" fill="var(--ac2)" stroke="var(--ac)" stroke-width="2"><circle cx="100" cy="55" r="22"/><rect x="92" y="74" width="16" height="20" stroke="none"/>${body}
<line x1="${lx[0]+8}" y1="98" x2="${lx[0]-6}" y2="195" stroke-width="14" stroke-linecap="round"/><line x1="${lx[1]-8}" y1="98" x2="${lx[1]+6}" y2="195" stroke-width="14" stroke-linecap="round"/>
<polygon points="${F?'66,235 99,235 95,400 80,400':'74,235 99,235 95,400 80,400'}"/><polygon points="${F?'134,235 101,235 105,400 120,400':'126,235 101,235 105,400 120,400'}"/>
${ys.map((y,i)=>`<line x1="${i===5?lx[1]-10:30}" y1="${y[0]}" x2="${i===5?lx[1]+12:170}" y2="${y[0]}" stroke="var(--wa)" stroke-width="1" stroke-dasharray="3 3"/><circle cx="${i===5?186:182}" cy="${y[0]}" r="9" fill="var(--wa)" stroke="none"/><text x="${i===5?186:182}" y="${y[0]+4}" text-anchor="middle" font-size="11" fill="#fff" stroke="none">${i+1}</text>`).join('')}</svg></div>
<div class="c"><h2>Como medir</h2><div class="mu">Fita métrica flexível, sem apertar a pele, paralela ao chão. Meça de manhã, em jejum, com pouca roupa, sempre no mesmo lado do corpo. Expire normalmente antes de ler.</div>
<table><tr><td>Peso e altura</td><td>Descalço, balança em piso firme; altura encostado na parede, olhando para frente, calcanhares juntos.</td></tr>
${[['1 Pescoço','Logo abaixo da laringe (“gogó”), fita levemente inclinada para a frente.'],['2 '+(F?'Busto/Tórax':'Tórax'),F?'Linha dos mamilos, fita passando pelas costas na altura das axilas.':'Linha dos mamilos, braços relaxados ao lado do corpo.'],['3 Cintura','Menor circunferência entre as costelas e o quadril, em pé e relaxado.'],['4 Abdome','Na altura do umbigo, sem encolher a barriga.'],['5 Quadril','Maior perímetro sobre os glúteos, pés juntos.'],['6 Braço','Braço relaxado; ponto médio entre o ombro (acrômio) e o cotovelo.'],['7 Coxa','Em pé, ponto médio entre a dobra da virilha e o joelho.'],['8 Panturrilha','Maior perímetro da panturrilha, sentado com o joelho a 90°.']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
<div class="mu">Dica: faça 2 medidas por ponto e use a média. % de gordura só é confiável com bioimpedância calibrada ou dobras cutâneas feitas por profissional.</div></div>`}
go();
</script></body></html>
